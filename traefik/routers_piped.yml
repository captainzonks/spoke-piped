# ==============================================================================
# PIPED MODULE - TRAEFIK ROUTERS
# ==============================================================================
# Description: Traefik dynamic router definitions for the piped module
# Author: Matt Barham
# Created: 2026-04-25
# Modified: 2026-04-26
# Version: 1.1.0
# Host: Your Server
# ==============================================================================
# Type: Traefik Dynamic Config (routers)
# Component: module: piped
# ==============================================================================
# Domain Mapping (subdomain prefix is templated, see .env.example):
#   - ${PIPED_FRONTEND_SUBDOMAIN}.DOMAIN  -> piped-frontend (web UI)
#   - ${PIPED_API_SUBDOMAIN}.DOMAIN       -> piped-backend  (Java API)
#   - ${PIPED_PROXY_SUBDOMAIN}.DOMAIN     -> piped-proxy    (ytproxy)
# ==============================================================================
# Note: ${VAR} placeholders are expanded by Spoke's deploy_traefik_rules.sh
#       (>= 1.3.0) at deploy time using the module's generated .env. The
#       {{ env "DOMAIN" }} template is expanded by Traefik at runtime.
# ==============================================================================

http:
  routers:
    piped-frontend:
      rule: Host(`${PIPED_FRONTEND_SUBDOMAIN}.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      priority: 100
      middlewares: chain-public@file
      service: piped-frontend-svc@file

    piped-api:
      rule: Host(`${PIPED_API_SUBDOMAIN}.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      priority: 100
      middlewares: chain-api@file
      service: piped-backend-svc@file

    # /streams is the only po_token-gated path: route it to the yt-dlp resolver
    # so adaptive 1080p/4K is returned. Higher priority than piped-api so the
    # path match wins; all other API paths fall through to piped-backend.
    piped-api-streams:
      rule: Host(`${PIPED_API_SUBDOMAIN}.{{ env "DOMAIN" }}`) && PathPrefix(`/streams`)
      entryPoints: "websecure"
      priority: 200
      middlewares: chain-api@file
      service: piped-resolver-svc@file

    piped-proxy:
      rule: Host(`${PIPED_PROXY_SUBDOMAIN}.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      priority: 100
      middlewares: chain-media@file
      service: piped-proxy-svc@file
